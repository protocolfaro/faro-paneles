<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Faro Protocol v2.0 - Cancha Vélez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Epilogue:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/pyalot/webgl-heatmap@master/webgl-heatmap.js"></script>
<style>
:root {
  --bg:#07090c; --gold:#c9a84c; --whi:#f0ece4; --dim:#8a8580;
  --red:#d94f4f; --yel:#d4a017; --grn:#4a9e6a;
  --card:rgba(10,14,20,0.97);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--whi);
  font-family:'Epilogue',sans-serif;
  display:flex;flex-direction:row;
  width:100vw;height:100vh;overflow:hidden;
}

/* TABS */
.nav-tabs{
  position:absolute;top:14px;left:18px;z-index:100;
  display:flex;gap:5px;overflow-x:auto;
  max-width:calc(55% - 36px);white-space:nowrap;
}
.nav-tabs::-webkit-scrollbar{display:none}
.tab-btn{
  background:rgba(25,30,38,0.6);border:1px solid rgba(255,255,255,0.08);
  color:var(--dim);padding:5px 10px;border-radius:12px;
  font-size:10px;font-weight:600;cursor:pointer;
  font-family:'Epilogue',sans-serif;transition:all .2s;
}
.tab-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}

/* CAMPO */
.wrapper-field{
  width:55%;height:100%;
  display:flex;align-items:center;justify-content:center;
  position:relative;padding:50px 20px 20px 50px;
}
.stadium-label{
  position:absolute;left:22px;top:50%;
  transform:translateX(-50%) rotate(-90deg);
  font-size:9px;color:rgba(255,255,255,0.22);
  white-space:nowrap;letter-spacing:1px;font-weight:600;
  text-transform:uppercase;
}
.field-container{
  position:relative;width:100%;
  aspect-ratio:68/105;
  background:#0d1f10;border-radius:8px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.03);
}
#heatmapCanvas{
  position:absolute;top:0;left:0;
  width:100%;height:100%;z-index:1;
}
.field-lines{
  position:absolute;top:0;left:0;
  width:100%;height:100%;z-index:2;
  pointer-events:none;
}
.nodes-layer{
  position:absolute;top:0;left:0;
  width:100%;height:100%;z-index:3;
  pointer-events:none;
}
.node-dot{
  position:absolute;
  width:9px;height:9px;
  background:#fff;border:1.5px solid rgba(0,0,0,0.4);
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 10px rgba(255,255,255,0.9);
}

/* PANEL DERECHO */
.panel-right{
  width:45%;height:100%;
  background:var(--card);
  border-left:1px solid rgba(255,255,255,0.06);
  padding:20px;display:flex;flex-direction:column;overflow:hidden;
}
.panel-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding-bottom:10px;margin-bottom:10px;
}
.ph-title{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.ph-sync{text-align:right;font-size:10px;color:var(--dim);font-weight:600;line-height:1.4}

/* AGENTES */
.agents-list{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;
  margin-bottom:12px;padding-right:3px;
}
.agents-list::-webkit-scrollbar{width:3px}
.agents-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.07);border-radius:2px}
.agent-row{
  display:grid;grid-template-columns:90px 1fr 1fr 1fr;
  align-items:center;padding:5px 8px;gap:6px;
  background:rgba(255,255,255,0.01);
  border:1px solid rgba(255,255,255,0.03);
  border-radius:4px;font-size:8.5px;color:var(--dim);
}
.agent-name{
  display:flex;align-items:center;gap:5px;
  font-weight:600;color:var(--whi);font-size:9.5px;
}
.agent-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--grn);box-shadow:0 0 5px var(--grn);
  flex-shrink:0;
}
.agent-col span{
  display:block;color:rgba(255,255,255,0.5);
  font-size:7.5px;font-weight:700;text-transform:uppercase;margin-bottom:1px;
}
.agent-row.active{
  background:rgba(201,168,76,0.08);
  border-color:var(--gold);
}
.agent-row.active .agent-name{color:var(--gold)}
.agent-row.active .agent-dot{background:var(--gold);box-shadow:0 0 5px var(--gold)}

/* CARD PRESCRIPCION */
.presc-card{
  background:rgba(20,10,10,0.95);
  border:1px solid var(--red);border-radius:6px;
  padding:14px;display:flex;flex-direction:column;gap:8px;
}
.pc-header{display:flex;justify-content:space-between;align-items:center}
.pc-zona{font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.5px}
.pc-badge{
  font-size:9px;font-weight:700;padding:3px 7px;
  border-radius:4px;color:#fff;letter-spacing:.5px;
  background:var(--red);
}
.pc-texto{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;font-weight:700;color:var(--gold);line-height:1.35;
}
.pc-meta{
  font-size:9px;color:var(--dim);font-weight:600;
  border-top:1px solid rgba(255,255,255,0.05);padding-top:8px;
}

/* MOBILE */
@media(max-width:768px){
  body{flex-direction:column;overflow-y:auto;height:auto}
  .nav-tabs{max-width:calc(100% - 20px);left:10px;top:10px}
  .wrapper-field{width:100%;height:52vh;padding:44px 12px 10px 12px}
  .panel-right{width:100%;border-left:none;border-top:1px solid rgba(255,255,255,0.06)}
  .stadium-label{display:none}
  .agent-row{grid-template-columns:80px 1fr}
  .agent-col:nth-child(3),.agent-col:nth-child(4){display:none}
}
</style>
</head>
<body>

<div class="nav-tabs" id="navTabs"></div>

<div class="wrapper-field">
  <div class="stadium-label">Estadio Jose Amalfitani, Velez Sarsfield</div>
  <div class="field-container" id="fieldContainer">
    <canvas id="heatmapCanvas"></canvas>
    <svg class="field-lines" viewBox="0 0 68 105" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grass" width="8" height="105" patternUnits="userSpaceOnUse">
          <rect width="4" height="105" fill="rgba(255,255,255,0.025)"/>
        </pattern>
      </defs>
      <rect width="68" height="105" fill="url(#grass)"/>
      <rect x="3" y="3" width="62" height="99" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
      <line x1="3" y1="52.5" x2="65" y2="52.5" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
      <circle cx="34" cy="52.5" r="9.15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
      <rect x="13.8" y="3" width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
      <rect x="13.8" y="85.5" width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
      <rect x="22" y="3" width="24" height="5.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.5"/>
      <rect x="22" y="96.5" width="24" height="5.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.5"/>
    </svg>
    <div class="nodes-layer" id="nodesLayer"></div>
  </div>
</div>

<div class="panel-right">
  <div class="panel-header">
    <div class="ph-title">FARO PROTOCOL v2.0 - CANCHA VELEZ</div>
    <div class="ph-sync">9:00 UTC<br><span style="font-size:8px">SYNC: SAT/RADAR/CLIMA</span></div>
  </div>
  <div class="agents-list" id="agentsList"></div>
  <div class="presc-card" id="prescCard">
    <div class="pc-header">
      <div class="pc-zona" id="pcZona">DIAGNOSTICO: EVALUANDO...</div>
      <div class="pc-badge" id="pcBadge">PRIORIDAD --</div>
    </div>
    <div class="pc-texto" id="pcTexto">Sincronizando telemetria satelital...</div>
    <div class="pc-meta" id="pcMeta">HUMEDAD: -- | SUPERFICIE: --</div>
  </div>
</div>

<script>
const ENDPOINT = '../velez_data.json';
let dataGlobal = [], wlGlobal = {}, heatmap = null;

// Inicializar WebGL heatmap
function initWebGL() {
  const canvas = document.getElementById('heatmapCanvas');
  try {
    heatmap = createWebGLHeatmap({
      canvas: canvas,
      intensityToAlpha: true,
      alphaRange: [0, 0.92]
    });
  } catch(e) {
    console.warn('WebGL heatmap fallback CSS:', e);
    heatmap = null;
  }
}

// Renderizar heatmap con nodos
function renderHeatmap(nodos) {
  const canvas = document.getElementById('heatmapCanvas');
  const W = canvas.offsetWidth || canvas.parentElement.offsetWidth;
  const H = canvas.offsetHeight || canvas.parentElement.offsetHeight;
  canvas.width  = W;
  canvas.height = H;

  if(heatmap) {
    heatmap.clear();
    nodos.forEach(n => {
      const x = n.x * W;
      const y = n.y * H;
      // Tamano de mancha proporcional al stress y al campo
      const size  = Math.min(W, H) * (0.35 + n.stress * 0.45);
      const intens = n.stress;
      heatmap.addPoint(x, y, size, intens);
    });
    heatmap.update();
    heatmap.draw();

    // Paleta personalizada: aplicar colorize con canvas 2D encima
    applyFaroPalette(canvas, W, H);
  } else {
    // Fallback CSS si WebGL no disponible
    fallbackCSS(nodos);
  }
}

// Paleta Faro: verde -> amarillo -> rojo -> violeta
function applyFaroPalette(glCanvas, W, H) {
  // Crear canvas 2D temporal para leer pixeles y recolorizar
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const ctx = tmp.getContext('2d');

  // Leer imagen del WebGL canvas
  const gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
  if(!gl) return;
  const pixels = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

  const imgData = ctx.createImageData(W, H);
  for(let i = 0; i < W * H; i++) {
    // WebGL lee de abajo a arriba, invertir Y
    const srcRow = H - 1 - Math.floor(i / W);
    const srcCol = i % W;
    const srcIdx = (srcRow * W + srcCol) * 4;
    const alpha  = pixels[srcIdx + 3] / 255; // intensidad normalizada

    // Mapear alpha a paleta Faro
    let r, g, b;
    if(alpha < 0.001) {
      // Transparente - fondo cesped
      imgData.data[i*4+3] = 0;
      continue;
    } else if(alpha < 0.3) {
      // Verde cesped -> amarillo
      const t = alpha / 0.3;
      r = Math.round(30  + t * 190);
      g = Math.round(80  + t * 120);
      b = Math.round(20  - t * 20);
    } else if(alpha < 0.65) {
      // Amarillo -> rojo vivo
      const t = (alpha - 0.3) / 0.35;
      r = Math.round(220 + t * 15);
      g = Math.round(200 - t * 160);
      b = Math.round(0);
    } else {
      // Rojo -> violeta/purpura critico
      const t = (alpha - 0.65) / 0.35;
      r = Math.round(235 - t * 80);
      g = Math.round(40  - t * 10);
      b = Math.round(0   + t * 160);
    }
    imgData.data[i*4+0] = r;
    imgData.data[i*4+1] = g;
    imgData.data[i*4+2] = b;
    imgData.data[i*4+3] = Math.round(alpha * 230);
  }
  ctx.putImageData(imgData, 0, 0);

  // Dibujar el canvas recoloreado sobre el campo
  const overlay = document.createElement('canvas');
  overlay.width = W; overlay.height = H;
  overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none';
  overlay.id = 'paletteOverlay';
  const existing = document.getElementById('paletteOverlay');
  if(existing) existing.remove();
  const field = document.getElementById('fieldContainer');
  const octx = overlay.getContext('2d');
  octx.drawImage(tmp, 0, 0);
  field.insertBefore(overlay, field.querySelector('.field-lines'));
}

// Fallback CSS si no hay WebGL
function fallbackCSS(nodos) {
  const overlay = document.getElementById('fieldContainer');
  const existing = document.getElementById('paletteOverlay');
  if(existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'paletteOverlay';
  div.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;mix-blend-mode:hard-light';
  div.style.background = nodos.map(n => {
    const x = n.x*100, y = n.y*100;
    if(n.stress > 0.7)
      return `radial-gradient(circle at ${x}% ${y}%, rgba(106,27,154,0.9) 0%, rgba(217,79,79,0.75) 25%, rgba(212,160,23,0.5) 50%, transparent 70%)`;
    if(n.stress > 0.4)
      return `radial-gradient(circle at ${x}% ${y}%, rgba(217,79,79,0.8) 0%, rgba(212,160,23,0.6) 40%, transparent 70%)`;
    return `radial-gradient(circle at ${x}% ${y}%, rgba(212,160,23,0.45) 0%, transparent 60%)`;
  }).join(', ');
  overlay.insertBefore(div, overlay.querySelector('.field-lines'));
}

// Nodos fallback por cancha (distintos segun ndvi real)
function nodosDesdeCancha(cancha) {
  if(cancha.zonas_estres?.nodos?.length) return cancha.zonas_estres.nodos;
  const ndvi  = cancha.ndvi || 0.08;
  const estado = cancha.estado_detectado || 'normal';
  const s = estado==='resiembra_activa'?0.92:estado==='stress_hidrico'?0.72:
            estado==='compactacion'?0.78:estado==='fungosis'?0.68:
            Math.max(0.06, Math.min(0.95, 1-(ndvi/0.65)));
  const v = ((cancha.id?.charCodeAt(0)||50)%10)/40;
  return [
    {x:0.25,y:0.14,stress:Math.min(1,s*0.72+v)},
    {x:0.75,y:0.14,stress:Math.min(1,s*0.68+v*0.8)},
    {x:0.25,y:0.50,stress:Math.min(1,s+v*0.4)},
    {x:0.75,y:0.50,stress:Math.min(1,s*0.96+v*0.5)},
    {x:0.25,y:0.86,stress:Math.min(1,s*0.78+v*0.6)},
    {x:0.75,y:0.86,stress:Math.min(1,s*0.73+v*0.8)},
  ];
}

// Dibujar puntos de control
function renderNodes(nodos) {
  const layer = document.getElementById('nodesLayer');
  layer.innerHTML = '';
  nodos.forEach(n => {
    const dot = document.createElement('div');
    dot.className = 'node-dot';
    dot.style.left = (n.x*100)+'%';
    dot.style.top  = (n.y*100)+'%';
    layer.appendChild(dot);
  });
}

// Pipeline de agentes dinamicos
function buildAgentPipeline(zona, prioridad, prescripcion, wl) {
  const ndvi   = wl.gndvi_por_cancha?.canchas?.['1fa']?.ndvi || 0.06;
  const fuente = (wl.gndvi_por_cancha?.fuente||'Sentinel-2').split('·')[0].trim();
  const sm     = wl.humedad_suelo_pct || 43;
  const et0    = wl.et0_mm_dia || 0.6;
  const ds     = wl.riesgo_dollar_spot_pct || 30;
  const hora   = wl.hora_riego_optima || '05:00';
  const activo = prioridad >= 3;

  const agentes = [
    {n:'Optico',        s:`NDVI=${ndvi.toFixed(3)} (${fuente})`,  w:'Coherencia optica validada',         q:'Base calculo estres foliar'},
    {n:'HLS/MODIS',     s:'Fusion multi-fuente diaria',            w:'Sin nubes garantizado',              q:'Cobertura 1-3 dias'},
    {n:'SAR Nacional',  s:'Sentinel-1C/D + SAOCOM',               w:'Radar Argentina activo',             q:'Backscatter HH/HV'},
    {n:'Hidrologia',    s:`SM=${sm.toFixed(0)}% superficie`,       w:'Humedad subsuperficial real',        q:'Perfil Van Genuchten'},
    {n:'Filtro',        s:'Stanford 4-vecinos NumPy',              w:'Reduccion ruido SAR',                q:'Señal limpia'},
    {n:'Fungosis',      s:`Dollar Spot ${ds.toFixed(0)}%`,         w:'Clima favorable infeccion',          q:'Alerta preventiva'},
    {n:'Interpolacion', s:'IDW Gaussiano WebGL',                   w:'GPU fragment shaders',               q:'Heatmap 10m efectivo'},
    {n:'ET0',           s:`${et0.toFixed(1)}mm/dia`,               w:'Penman-Monteith FAO-56',             q:`Riego optimo ${hora}`},
    {n:'Render GPU',    s:'WebGL pyalot heatmap',                  w:'Blending aditivo GPU',               q:'Manchas organicas reales'},
    {n:'Motor Faro',    s:activo?`ALERTA: ${zona}`:'Normal',       w:prescripcion?.split('--')[0]?.trim()||'Sintesis completa', q:prescripcion?.split('--')[1]?.trim()||'Sin urgencias', activo},
    {n:'INTA',          s:'CC=0.32 pampeana',                      w:'Cap. Campo Balcarce',                q:'Balance hidrico'},
    {n:'USDA/FAO',      s:'FAO-56 Penman-Monteith',               w:'Estandar ET0',                      q:'Validado NASA POWER'},
    {n:'Copernicus',    s:'ESA Sentinel / NASA HLS',               w:'Fuentes oficiales',                  q:'SHA-256 verificado'},
  ];

  const list = document.getElementById('agentsList');
  list.innerHTML = '';
  agentes.forEach(ag => {
    const row = document.createElement('div');
    row.className = 'agent-row' + (ag.activo?' active':'');
    row.innerHTML = `
      <div class="agent-name">
        <div class="agent-dot"></div>${ag.n}
      </div>
      <div class="agent-col"><span>Paso a Paso</span>${ag.s}</div>
      <div class="agent-col"><span>Por Que</span>${ag.w}</div>
      <div class="agent-col"><span>Para Que</span>${ag.q}</div>`;
    list.appendChild(row);
  });
}

// Sincronizar panel con cancha activa
function syncPanelData(cancha, wl) {
  if(!cancha) return;
  const nodos = nodosDesdeCancha(cancha);
  const ze    = cancha.zonas_estres || {};
  const zona  = ze.zona_critica || 'Normal';
  const prio  = ze.prioridad || 1;
  const presc = cancha.prescripcion_operativa || cancha.detalle || 'Sin acciones requeridas hoy.';
  const sm    = wl.humedad_suelo_pct?.toFixed(0) || '43';
  const lst   = wl.temp_superficie_lst_c?.toFixed(1) || wl.temp_suelo_0cm?.toFixed(1) || '11.1';

  // Heatmap WebGL
  renderHeatmap(nodos);
  renderNodes(nodos);

  // Card prescripcion
  document.getElementById('pcZona').textContent  = 'DIAGNOSTICO: ' + zona.toUpperCase();
  document.getElementById('pcTexto').textContent = presc;
  document.getElementById('pcMeta').textContent  = `HUMEDAD: ${sm}% | SUPERFICIE: ${lst}C`;

  const badge = document.getElementById('pcBadge');
  const card  = document.getElementById('prescCard');
  badge.textContent = 'PRIORIDAD ' + prio;
  if(prio >= 6)      { badge.style.background=card.style.borderColor='var(--red)'; }
  else if(prio >= 3) { badge.style.background=card.style.borderColor='var(--yel)'; }
  else               { badge.style.background='var(--grn)';card.style.borderColor='rgba(255,255,255,0.1)'; }

  // Agentes
  buildAgentPipeline(zona, prio, presc, wl);
}

// Init principal
async function masterInit() {
  initWebGL();
  try {
    const res  = await fetch(ENDPOINT);
    const data = await res.json();
    wlGlobal   = data.weather_live || {};

    const estadio = data.sectores?.estadio
      ? [{...data.sectores.estadio, id:'amalfitani', nombre:'Amalfitani'}] : [];
    const vo = data.sectores?.canchero?.canchas || [];
    dataGlobal   = [...estadio, ...vo];

    const nav = document.getElementById('navTabs');
    nav.innerHTML = '';
    dataGlobal.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i===0?' active':'');
      btn.textContent = (c.id||'C'+(i+1)).toUpperCase();
      btn.onclick = () => {
        nav.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        syncPanelData(c, wlGlobal);
      };
      nav.appendChild(btn);
    });

    syncPanelData(dataGlobal[0], wlGlobal);
  } catch(e) {
    console.error('Error cargando datos:', e);
    document.getElementById('pcTexto').textContent = 'Error de conexion. Reintentando...';
  }
}

window.onload = masterInit;
</script>
</body>
</html>
