<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Faro OS · Vélez · Roger Bernal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Epilogue:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0a0a0a;
    --card: rgba(18,20,23,0.92);
    --border: rgba(38,43,53,0.6);
    --gold: #c9a84c;
    --red: #E53E3E;
    --yellow: #EAB308;
    --green: #22C55E;
    --muted: #9ca3af;
    --text: #f3f4f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Epilogue', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
header {
    padding: 16px 20px 12px;
    background: linear-gradient(to bottom, rgba(10,10,10,.98) 80%, transparent);
    flex-shrink: 0;
}
.header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
}
h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.user-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold);
}
.tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
    background: rgba(20,22,26,.8);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Epilogue', sans-serif;
    transition: all .15s;
    flex-shrink: 0;
    border-left-width: 3px;
}
.tab:hover { border-color: var(--gold); color: #fff; }
.tab.active { background: rgba(201,168,76,.15); border-color: var(--gold); color: var(--gold); border-left-color: var(--gold); }
.tab.sem-rojo  { border-left-color: var(--red); }
.tab.sem-amarillo { border-left-color: var(--yellow); }
.tab.sem-verde { border-left-color: var(--green); }
.panels {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    flex: 1;
    min-height: 0;
}
.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(12px);
    flex: 1;
    min-width: 0;
}
.panel-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    border-left: 2px solid var(--gold);
    padding-left: 6px;
    margin-bottom: 14px;
    flex-shrink: 0;
}
.panel-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 0;
    gap: 12px;
}

/* Panel 1 */
.zona-wrap { display: flex; justify-content: center; align-items: center; }
.zona-circle {
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0.88;
    transition: all .4s;
}
.zona-circle.glow-red   { box-shadow: 0 0 28px rgba(229,62,62,.5); }
.zona-circle.glow-yellow{ box-shadow: 0 0 28px rgba(234,179,8,.4); }
.zona-circle.glow-green { box-shadow: 0 0 28px rgba(34,197,94,.4); }
.zona-label {
    font-size: 11px;
    font-weight: 800;
    color: rgba(0,0,0,.7);
    text-align: center;
}
.campo-metrics {
    display: flex;
    gap: 22px;
    justify-content: center;
}
.metric { text-align: center; }
.mval { display: block; font-size: 22px; font-weight: 800; }
.mlbl { font-size: 9px; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; }
.campo-detalle {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    line-height: 1.55;
    max-width: 190px;
}

/* Panel 2 */
.no-focos {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    font-style: italic;
}
.focos-list { width: 100%; }
.foco {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
}
.foco:last-child { border-bottom: none; }
.foco-n {
    width: 18px;
    height: 18px;
    min-width: 18px;
    background: rgba(229,62,62,.15);
    border: 1px solid var(--red);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 800;
    color: var(--red);
}
.foco-txt { font-size: 11px; line-height: 1.55; }

/* Footer */
footer {
    padding: 10px 16px 16px;
    background: linear-gradient(to top, rgba(10,10,10,1) 70%, transparent);
    flex-shrink: 0;
}
.footer-row { display: flex; gap: 16px; align-items: center; }
.kpi-block { }
.kpi-val { font-size: 20px; font-weight: 800; }
.kpi-lbl { font-size: 9px; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; }
.kpi-bar-bg { width: 56px; height: 2px; background: #222; border-radius: 1px; margin-top: 3px; }
.kpi-bar-fill { height: 100%; border-radius: 1px; transition: width .4s; background: var(--gold); }
.footer-accion {
    flex: 1;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.55;
    border-left: 2px solid rgba(255,255,255,.08);
    padding-left: 12px;
}
.footer-accion strong { color: var(--text); }
.footer-accion .alert { color: var(--red); }

/* Responsive: stack panels on narrow screens */
@media (max-width: 420px) {
    .panels { flex-direction: column; }
}
</style>
</head>
<body>

<header>
    <div class="header-row">
        <h1>Faro <span style="font-family:Epilogue;font-weight:300;font-size:13px;color:var(--gold)">OS</span></h1>
        <span class="user-badge">Roger Bernal</span>
    </div>
    <div class="tabs" id="tabs"></div>
</header>

<div class="panels">
    <div class="panel">
        <div class="panel-label">Panel 1 · Zona</div>
        <div class="panel-content" id="panel1-content">
            <div style="color:var(--muted);font-size:11px">Cargando…</div>
        </div>
    </div>
    <div class="panel">
        <div class="panel-label">Panel 2 · Alertas</div>
        <div class="panel-content" id="panel2-content">
            <div style="color:var(--muted);font-size:11px">Cargando…</div>
        </div>
    </div>
</div>

<footer>
    <div class="footer-row" id="footer-row">
        <div style="color:var(--muted);font-size:11px">…</div>
    </div>
</footer>

<script>
const RAILWAY = 'https://faroprotocol-production-45fd.up.railway.app';
let DATA = null;
let ACTIVE = null;

async function init() {
    try {
        const ctrl = new AbortController();
        const tid  = setTimeout(() => ctrl.abort(), 4000);
        const r = await fetch(`${RAILWAY}/velez/panel-roger-canonical`, { signal: ctrl.signal });
        clearTimeout(tid);
        if (r.ok) DATA = await r.json();
    } catch(_) {}

    if (!DATA) {
        try {
            const r = await fetch('./velez_data.json');
            if (r.ok) DATA = await r.json();
        } catch(_) {}
    }

    if (!DATA) {
        document.getElementById('panel1-content').innerHTML =
            '<div style="color:var(--muted);font-size:12px;text-align:center">Sin conexión con el servidor</div>';
        return;
    }

    buildTabs();
    const canchas = DATA.sectores?.canchero?.canchas ?? [];
    if (canchas.length > 0) activateTab(canchas[0].id);
}

function buildTabs() {
    const canchas = DATA.sectores?.canchero?.canchas ?? [];
    const estadio = DATA.sectores?.estadio;

    const html = canchas.map(c =>
        `<button class="tab sem-${c.sem ?? 'rojo'}" id="tab-${c.id}" onclick="activateTab('${c.id}')">${c.nombre ?? c.id.toUpperCase()}</button>`
    ).join('');

    const amalfitaniTab = estadio
        ? `<button class="tab sem-${estadio.sem ?? 'amarillo'}" id="tab-amalfitani" onclick="activateTab('amalfitani')">Amalfitani</button>`
        : '';

    document.getElementById('tabs').innerHTML = html + amalfitaniTab;
}

function resolveCancha(cid) {
    if (cid === 'amalfitani') {
        const e = DATA.sectores?.estadio ?? {};
        return {
            id: 'amalfitani',
            nombre: 'Amalfitani',
            score:      e.score      ?? 78,
            score_prev: e.score_prev ?? null,
            sem:        e.sem        ?? 'amarillo',
            ndvi:       DATA.usuarios?.roger?.heatmaps?.amalfitani?.ndvi ?? 0.048,
            detalle:    e.detalle    ?? ''
        };
    }
    const canchas = DATA.sectores?.canchero?.canchas ?? [];
    return canchas.find(x => x.id === cid) ?? null;
}

function activateTab(cid) {
    ACTIVE = cid;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const tabEl = document.getElementById('tab-' + cid);
    if (tabEl) tabEl.classList.add('active');

    const c = resolveCancha(cid);
    if (!c) return;

    const acciones = DATA.usuarios?.roger?.acciones ?? [];
    const cid_up  = cid.toUpperCase(); // '1FA', '2FA', etc.
    const accion_c = acciones.filter(a => a.includes(cid_up) || a.includes(c.nombre ?? '____'));

    renderCampo(c, accion_c);
    renderFocos(c, buildFocos(c, accion_c));
    renderFooter(c, accion_c);
}

function renderCampo(c, accion_c) {
    const month  = new Date().getMonth() + 1; // 1–12
    const isWinter = month >= 5 && month <= 8;
    const score  = c.score ?? 50;
    const ndvi   = c.ndvi  ?? 0.05;
    const sem    = c.sem   ?? 'rojo';

    // Bigger circle = worse condition
    const r = Math.max(14, Math.min(46, (100 - score) / 2 + 14));
    const d = r * 2;

    // Color: rojo→amarillo en meses de invierno
    let color, glowClass;
    if (sem === 'verde') {
        color = '#22C55E'; glowClass = 'glow-green';
    } else if (sem === 'amarillo') {
        color = '#EAB308'; glowClass = 'glow-yellow';
    } else if (isWinter) {
        color = '#EAB308'; glowClass = 'glow-yellow'; // rojo ajustado a amarillo en invierno
    } else {
        color = '#E53E3E'; glowClass = 'glow-red';
    }

    // Label: uso hours from detalle when present
    const usoMatch = c.detalle?.match(/(\d+\.?\d*)h(?:[\s·]|$)/);
    const label = usoMatch ? usoMatch[1] + 'h' : '';

    const ndviColor = ndvi >= 0.12 ? '#22C55E' : ndvi >= 0.08 ? '#EAB308' : '#E53E3E';

    document.getElementById('panel1-content').innerHTML = `
        <div class="zona-wrap">
            <div class="zona-circle ${glowClass}" style="width:${d}px;height:${d}px;background:${color}">
                ${label ? `<span class="zona-label">${label}</span>` : ''}
            </div>
        </div>
        <div class="campo-metrics">
            <div class="metric">
                <span class="mval" style="color:${color}">${score}</span>
                <span class="mlbl">Score</span>
            </div>
            <div class="metric">
                <span class="mval" style="color:${ndviColor}">${ndvi.toFixed(3)}</span>
                <span class="mlbl">NDVI</span>
            </div>
        </div>
        <div class="campo-detalle">${c.detalle ?? ''}</div>
    `;
}

function renderFocos(c, focos) {
    const el = document.getElementById('panel2-content');
    if (focos.length === 0) {
        el.innerHTML = '<div class="no-focos">Sin alertas específicas</div>';
        return;
    }
    el.innerHTML = `<div class="focos-list">${
        focos.map((f, i) => `
            <div class="foco">
                <span class="foco-n">${i + 1}</span>
                <span class="foco-txt">${f}</span>
            </div>`
        ).join('')
    }</div>`;
}

function buildFocos(c, accion_c) {
    // Sin acción específica de Roger → sin focos numerados
    if (accion_c.length === 0) return [];

    const focos = [...accion_c];

    // Agregar riesgo fungosis si la cancha está en la lista de riesgo
    const fungRisk = DATA.weather_live?.riesgo_fungosis?.canchas_en_riesgo ?? [];
    if (fungRisk.includes(c.id)) {
        const nivel = DATA.weather_live.riesgo_fungosis.nivel?.toUpperCase() ?? 'MEDIO';
        const horas = DATA.weather_live.riesgo_fungosis.horas_favorables_48h ?? '';
        const desc  = `Dollar Spot ${nivel} — ${horas}h favorables últimas 48h`;
        // No duplicar si ya hay un foco de fungicida mencionado
        if (!focos.some(f => f.toLowerCase().includes('dollar spot') || f.toLowerCase().includes('fungicida'))) {
            focos.push(desc);
        }
    }

    return focos;
}

function renderFooter(c, accion_c) {
    const score     = c.score ?? 0;
    const scorePrev = c.score_prev;
    const delta     = scorePrev != null ? score - scorePrev : null;
    const deltaStr  = delta != null
        ? `<span style="font-size:10px;font-weight:400;color:${delta >= 0 ? 'var(--green)' : 'var(--red)'}"> ${delta >= 0 ? '+' : ''}${delta}</span>`
        : '';

    const sem = c.sem ?? 'amarillo';
    const scoreColor = sem === 'verde' ? 'var(--green)' : sem === 'rojo' ? 'var(--red)' : 'var(--yellow)';

    // Texto de acción: usa accion específica o la instrucción general de corte
    const ventana = (DATA.usuarios?.roger?.acciones ?? []).find(a => a.includes('Ventana'));
    const accionText = accion_c.length > 0
        ? `<strong>${accion_c[0]}</strong>`
        : (ventana ? `${ventana}` : 'Sistema operativo. Sin alertas activas.');

    document.getElementById('footer-row').innerHTML = `
        <div class="kpi-block">
            <div class="kpi-lbl">Score</div>
            <div class="kpi-val" style="color:${scoreColor}">${score}${deltaStr}</div>
            <div class="kpi-bar-bg">
                <div class="kpi-bar-fill" style="width:${score}%;background:${scoreColor}"></div>
            </div>
        </div>
        <div class="footer-accion">${accionText}</div>
    `;
}

init();
</script>
</body>
</html>
