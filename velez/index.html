<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Faro OS · Vélez Sarsfield</title>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Epilogue:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-color@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-scale@4"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3"></script>
<style>
:root {
    --bg: #0a0a0a;
    --card: rgba(18,20,23,0.88);
    --border: rgba(38,43,53,0.5);
    --gold: #c9a84c;
    --red: #E53E3E;
    --muted: #9ca3af;
    --text: #f3f4f6;
}
body { margin:0; background:var(--bg); font-family:'Epilogue',sans-serif; color:var(--text); overflow:hidden; }
#map { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; }
#hud { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; display:flex; flex-direction:column; justify-content:space-between; }
header { background:linear-gradient(to bottom,rgba(10,10,10,.95) 60%,transparent); padding:20px; pointer-events:auto; }
h1 { font-family:'Cormorant Garamond',serif; font-size:22px; margin:0; text-transform:uppercase; letter-spacing:1px; }
.venue-bar { display:flex; gap:8px; overflow-x:auto; margin-top:12px; scrollbar-width:none; }
.venue-bar::-webkit-scrollbar { display:none; }
.vbtn { background:rgba(20,22,26,.8); border:1px solid var(--border); color:var(--muted); padding:8px 14px; font-size:11px; font-weight:600; text-transform:uppercase; border-radius:4px; cursor:pointer; white-space:nowrap; font-family:'Epilogue',sans-serif; transition:all .2s; pointer-events:auto; }
.vbtn:hover { border-color:var(--gold); color:#fff; }
.vbtn.active { background:rgba(201,168,76,.15); border-color:var(--gold); color:var(--gold); }
.right-panel { position:absolute; top:130px; right:16px; display:flex; flex-direction:column; gap:10px; max-width:210px; pointer-events:auto; z-index:10; }
.card { background:var(--card); border:1px solid var(--border); backdrop-filter:blur(12px); padding:14px; border-radius:6px; }
.card h2 { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); border-left:2px solid var(--gold); padding-left:6px; margin:0 0 10px; }
.lchk { display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:8px; cursor:pointer; color:var(--muted); }
.lchk input { display:none; }
.lchk .box { width:11px; height:11px; border:1px solid var(--border); border-radius:2px; flex-shrink:0; }
.lchk input:checked + .box { background:var(--gold); border-color:var(--gold); }
.lchk input:checked ~ span { color:#fff; font-weight:600; }
.fslider { width:100%; accent-color:var(--gold); margin-top:6px; }
.slbl { display:flex; justify-content:space-between; font-size:9px; color:var(--muted); margin-top:3px; }
footer { background:linear-gradient(to top,rgba(10,10,10,1) 70%,transparent); padding:20px; pointer-events:auto; }
.footer-row { display:flex; gap:20px; align-items:flex-start; }
.kpi { min-width:85px; }
.kval { font-size:22px; font-weight:800; }
.klbl { font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.5px; }
.bar-bg { width:100%; height:3px; background:#222; border-radius:2px; margin-top:4px; }
.bar-fill { height:100%; background:var(--gold); border-radius:2px; transition:width .4s; }
.terminal { flex:1; font-size:12px; line-height:1.65; border-left:2px solid rgba(255,255,255,.08); padding-left:14px; max-height:90px; overflow:hidden; }
.terminal strong { color:#fff; }
.alert { color:var(--red); }
#banner { position:absolute; top:115px; left:50%; transform:translateX(-50%); background:rgba(229,62,62,.12); border:1px solid var(--red); padding:5px 14px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; border-radius:20px; display:none; backdrop-filter:blur(8px); white-space:nowrap; z-index:20; }
.map-toggle { position:absolute; top:115px; left:16px; display:flex; gap:6px; pointer-events:auto; z-index:20; }
.mtbtn { background:rgba(18,20,23,.85); border:1px solid var(--border); color:var(--muted); padding:5px 12px; font-size:10px; font-weight:600; border-radius:4px; cursor:pointer; font-family:'Epilogue',sans-serif; transition:all .15s; }
.mtbtn.active { border-color:var(--gold); color:var(--gold); }
@media(min-width:768px) { .footer-row { align-items:center; } }
@keyframes pulse { 50%{opacity:.6} }
.pulse { animation:pulse 2s infinite; }
</style>
</head>
<body>

<div id="map"></div>

<div id="hud">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h1>Faro <span style="font-family:Epilogue;font-weight:300;font-size:13px;color:var(--gold)">OS</span></h1>
      <span id="surface-badge" style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted)"></span>
    </div>
    <div class="venue-bar">
      <button class="vbtn active" onclick="switchVenue('amalfitani',this)">Amalfitani</button>
      <button class="vbtn" onclick="switchVenue('villa_olimpica',this)">Villa Olímpica</button>
      <button class="vbtn" onclick="switchVenue('polideportivo',this)">Polideportivo</button>
      <button class="vbtn" onclick="switchVenue('paneles_solares',this)">Paneles Solares</button>
      <button class="vbtn" onclick="switchVenue('sede',this)">Sede</button>
      <button class="vbtn" onclick="switchVenue('piletas',this)">Piletas</button>
    </div>
  </header>

  <div id="banner">⚠️ Datos ópticos congelados — Radar SAR activo</div>

  <div class="map-toggle">
    <button class="mtbtn active" id="btn-dark" onclick="setBasemap('dark')">Oscuro</button>
    <button class="mtbtn" id="btn-sat" onclick="setBasemap('satellite')">Satélite</button>
  </div>

  <div class="right-panel">
    <div class="card" id="layer-card">
      <h2>Capas Activas</h2>
      <div id="layer-list"></div>
    </div>
    <div class="card" id="slider-card" style="display:none">
      <h2 id="slider-title">Control</h2>
      <div id="slider-body"></div>
    </div>
  </div>

  <footer>
    <div class="footer-row">
      <div class="kpi">
        <div class="klbl">Score</div>
        <div class="kval" id="score-val">--</div>
        <div class="bar-bg"><div class="bar-fill" id="score-bar" style="width:0"></div></div>
      </div>
      <div class="kpi" id="kpi2" style="display:none">
        <div class="klbl" id="kpi2-lbl"></div>
        <div class="kval" id="kpi2-val"></div>
      </div>
      <div class="terminal" id="terminal">Conectando con Faro OS…</div>
    </div>
  </footer>
</div>

<script>
// ── COORDENADAS REALES VÉLEZ ──────────────────────────────────────────────
const VENUES = {
    amalfitani:     { lng:-58.5288, lat:-34.6379, zoom:17.5 },
    villa_olimpica: { lng:-58.7193, lat:-34.6221, zoom:15.5 },
    polideportivo:  { lng:-58.5135, lat:-34.6333, zoom:17.5 },
    paneles_solares:{ lng:-58.522200, lat:-34.636800, zoom:19   },
    sede:           { lng:-58.523912, lat:-34.634620, zoom:18.5 },
    piletas:        { lng:-58.520900, lat:-34.637800, zoom:18.5 }
};

// ── FUENTE DE VERDAD: tiles_blueprint._BBOXES ─────────────────────────────
// _BBOXES = {
//   "velez":      (-58.540, -34.650, -58.520, -34.630),
//   "amalfitani": (-58.5305, -34.6391, -58.5271, -34.6367),
//   "balcarce":   (-58.250, -37.850, -58.200, -37.800),
//   "anelo":      (-68.860, -38.380, -68.790, -38.330),
// }
// Centroides calculados del bbox real de cada venue.
// Villa Olímpica no tiene bbox → grilla proporcional al plano oficial.
const CANCHA_COORDS = {
    // ── Amalfitani — centro exacto del bbox (-58.5305/-34.6391, -58.5271/-34.6367)
    'amalfitani':        [-58.5288, -34.6379],
    'cancha-principal':  [-58.5288, -34.6379],
    'campo-principal':   [-58.5288, -34.6379],
    // Sub-canchas: grilla 2×2 dentro del bbox (W=-58.5305, E=-58.5271)
    // Separación lng ≈ 0.0012° (~104m), lat ≈ 0.0010° (~111m)
    'cancha-1':   [-58.5300, -34.6371],   // NW
    'cancha-2':   [-58.5276, -34.6371],   // NE
    'cancha-3':   [-58.5300, -34.6385],   // SW
    'cancha-4':   [-58.5276, -34.6385],   // SE

    // ── Villa Olímpica — 12 canchas en 2 filas (plano oficial Vélez)
    // Centro: (-58.7193, -34.6221)
    // Fila 1: 1FA–10FA (sintético) — paso lng 0.000765° ≈ 70m por cancha
    // Fila 2: 1FP–2FP (pasto natural) — 110m al sur
    '1FA':  [-58.72274, -34.6216],
    '2FA':  [-58.72197, -34.6216],
    '3FA':  [-58.72121, -34.6216],
    '4FA':  [-58.72044, -34.6216],
    '5FA':  [-58.71968, -34.6216],
    '6FA':  [-58.71891, -34.6216],
    '7FA':  [-58.71814, -34.6216],
    '8FA':  [-58.71738, -34.6216],
    '9FA':  [-58.71661, -34.6216],
    '10FA': [-58.71585, -34.6216],
    '1FP':  [-58.71968, -34.6231],
    '2FP':  [-58.71891, -34.6231],
};

// ── CAPAS POR TIPO DE SUPERFICIE ─────────────────────────────────────────
const SURFACE_LAYERS = {
    natural:        ['ndvi','sar','temperatura','clima','fungosis'],
    hibrido:        ['ndvi','sar','temperatura','clima','fungosis'],
    sintetico:      ['sar','temperatura','insar'],
    polvo_ladrillo: ['sar','temperatura','insar'],
    indoor:         ['insar','temperatura'],
    fotovoltaico:   ['temperatura','clima'],
    acuatico:       ['temperatura','clima']
};

const LAYER_LABELS = {
    ndvi:        'NDVI Vegetativo',
    sar:         'SAR Compactación',
    temperatura: 'Temperatura Landsat',
    insar:       'InSAR Estructural',
    clima:       'Clima Open-Meteo',
    fungosis:    'Riesgo Dollar Spot',
    dale_play:   'Dale Play Recovery'
};

let map, deckOverlay, canonical, geojson;
let currentVenue   = 'amalfitani';
let activeL        = { ndvi:true, sar:true, temperatura:false, insar:false, clima:false, fungosis:false, dale_play:false };
let richDepth      = 1;
let showDay        = 0;
let hoveredCanchaId = null;   // cancha activa — activa capas de detalle
let svgOverlay      = null;   // SVG leader lines (técnica Nagix)
const RAILWAY = 'https://faroprotocol-production-45fd.up.railway.app';

// ── INIT ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [VENUES.amalfitani.lng, VENUES.amalfitani.lat],
        zoom:  VENUES.amalfitani.zoom,
        pitch: 55, bearing: -15,
        attributionControl: false
    });

    // Un solo canvas WebGL — deck.gl como overlay sobre MapLibre
    deckOverlay = new deck.MapboxOverlay({ interleaved: true, layers: [] });
    map.addControl(deckOverlay);
    map.on('load', async () => {
        // Cargar datos del assembler — triple fallback
        try {
            const [c, g] = await Promise.all([
                fetch(`${RAILWAY}/velez/panel-roger-canonical`).then(r => r.ok ? r.json() : Promise.reject(r.status)),
                fetch(`${RAILWAY}/velez/amalfitani-geojson`).then(r => r.ok ? r.json() : Promise.reject(r.status))
            ]);
            canonical = c;
            geojson   = g;
        } catch(_) {
            canonical = null;
            geojson   = { type:'FeatureCollection', features:[] };
        }

        setupSVGOverlay();
        renderUI();
        renderLayers();
    });
});

// ── BASEMAP TOGGLE ───────────────────────────────────────────────────────
function setBasemap(mode) {
    document.getElementById('btn-dark').classList.toggle('active', mode === 'dark');
    document.getElementById('btn-sat').classList.toggle('active', mode === 'satellite');

    if (mode === 'satellite') {
        if (!map.getSource('arcgis')) {
            map.addSource('arcgis', {
                type: 'raster',
                tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                tileSize: 256
            });
            map.addLayer({ id: 'arcgis-layer', type: 'raster', source: 'arcgis' });
        } else {
            map.setLayoutProperty('arcgis-layer', 'visibility', 'visible');
        }
    } else {
        if (map.getLayer('arcgis-layer')) {
            map.setLayoutProperty('arcgis-layer', 'visibility', 'none');
        }
    }
}

// ── VENUE SWITCH ─────────────────────────────────────────────────────────
function switchVenue(v, btn) {
    currentVenue = v;
    // Reset sliders al cambiar venue
    richDepth = 1;
    showDay   = 0;
    // Reset active layers a default sensato
    activeL = { ndvi:true, sar:true, temperatura:false, insar:false, clima:false, fungosis:false, dale_play:false };

    document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const c = VENUES[v];
    if (c && map) {
        map.flyTo({ center:[c.lng, c.lat], zoom:c.zoom, pitch:55, bearing:-15, duration:1800 });
    }
    renderUI();
    renderLayers();
}

// ── RENDER UI (HUD + layer selector) ─────────────────────────────────────
function renderUI() {
    if (!canonical) {
        document.getElementById('terminal').innerHTML = 'Sin conexión con el assembler. Reintentando…';
        return;
    }

    // Score — buscar en múltiples rutas del canonical
    const estadioS = canonical?.sectores?.estadio ?? {};
    const cancheroS = canonical?.sectores?.canchero ?? {};
    const venueS   = canonical?.sectores?.[currentVenue] ?? {};
    const score = venueS.score ?? estadioS.score ?? cancheroS.score ?? 0;

    // Tipo de superficie para este venue
    const hm = canonical?.usuarios?.roger?.heatmaps ?? {};
    const surface = hm[currentVenue]?.tipo_superficie
                 ?? canonical?.canchas?.[currentVenue]?.tipo_superficie
                 ?? 'natural';

    // Nubosidad — datos ópticos congelados si última imagen > 7 días
    const ageRaw = canonical?.satellite?.age_days;
    const nuboso  = ageRaw != null && Number(ageRaw) > 7;

    document.getElementById('surface-badge').textContent = surface.toUpperCase().replace(/_/g,' ');
    document.getElementById('score-val').textContent     = score || '--';
    document.getElementById('score-bar').style.width     = `${score || 0}%`;
    document.getElementById('banner').style.display      = nuboso ? 'block' : 'none';

    // Terminal — Hermes prescripción real
    const clim   = canonical?.hermes?.climate ?? {};
    const alerts = Array.isArray(canonical?.hermes?.alertas_fisicas) ? canonical.hermes.alertas_fisicas : [];
    const termLines = [];
    if (clim.et0_mm_dia        != null) termLines.push(`<strong>ET₀:</strong> ${clim.et0_mm_dia} mm/día`);
    if (clim.deficit_hidrico_mm != null) termLines.push(`<strong>Déficit:</strong> ${clim.deficit_hidrico_mm} mm`);
    if (clim.smith_kerns_pct   != null) termLines.push(`<strong>Dollar Spot:</strong> ${clim.smith_kerns_pct}%`);
    if (clim.ventana_corte)              termLines.push(`<strong>Corte:</strong> ${clim.ventana_corte}`);
    if (clim.riego_min)                  termLines.push(`<strong>Riego:</strong> ${clim.riego_min} min`);
    alerts.slice(0,2).forEach(a => {
        const msg = typeof a === 'string' ? a : (a.mensaje ?? JSON.stringify(a));
        termLines.push(`<span class="alert">⚠ ${msg}</span>`);
    });
    document.getElementById('terminal').innerHTML = termLines.length
        ? termLines.join('<br>')
        : 'Sistema operativo. Sin alertas activas.';

    // KPI secundario — InSAR si está disponible
    const kpi2    = document.getElementById('kpi2');
    const detalle = typeof venueS.detalle === 'string' ? venueS.detalle
                  : (typeof estadioS.detalle === 'string' ? estadioS.detalle : '');
    const insarM  = detalle.match(/InSAR\s*([\d.]+)\s*mm/i);
    if (insarM) {
        kpi2.style.display = 'block';
        document.getElementById('kpi2-lbl').textContent = 'InSAR';
        document.getElementById('kpi2-val').textContent = `${insarM[1]}mm`;
    } else {
        kpi2.style.display = 'none';
    }

    // Layer selector — solo capas disponibles para esta superficie
    const availLayers = SURFACE_LAYERS[surface] ?? SURFACE_LAYERS.natural;
    const hasShow     = canonical?.show_activo === true;
    const finalLayers = (hasShow && currentVenue === 'amalfitani')
        ? [...availLayers, 'dale_play']
        : availLayers;

    document.getElementById('layer-list').innerHTML = finalLayers.map(lk => `
        <label class="lchk">
            <input type="checkbox" id="chk-${lk}" ${activeL[lk] ? 'checked' : ''}
                   onchange="toggleLayer('${lk}')">
            <span class="box"></span>
            <span>${LAYER_LABELS[lk] ?? lk}</span>
        </label>`
    ).join('');

    // Slider card — Richards si humedad activa y hay datos; Dale Play si show activo
    const sc = document.getElementById('slider-card');
    const sb = document.getElementById('slider-body');
    const hasTheta = geojson?.features?.some(f => f.properties?.theta_5cm != null) ?? false;

    if (activeL.temperatura && finalLayers.includes('temperatura') && hasTheta) {
        sc.style.display = 'block';
        document.getElementById('slider-title').textContent = 'Profundidad Hidráulica';
        sb.innerHTML = `
            <input type="range" class="fslider" min="0" max="2" step="1" value="${richDepth}"
                   oninput="richDepth=+this.value; renderLayers()">
            <div class="slbl"><span>5 cm</span><span>10 cm</span><span>20 cm</span></div>`;
    } else if (activeL.dale_play && hasShow) {
        sc.style.display = 'block';
        document.getElementById('slider-title').textContent = 'Recovery Post-Show';
        sb.innerHTML = `
            <input type="range" class="fslider" min="0" max="35" step="1" value="${showDay}"
                   oninput="showDay=+this.value; renderLayers()">
            <div class="slbl"><span>Día 0</span><span>Día ${showDay}</span><span>Día 35</span></div>`;
    } else {
        sc.style.display = 'none';
    }
}

function toggleLayer(lk) {
    const el = document.getElementById('chk-' + lk);
    if (el) activeL[lk] = el.checked;
    renderLayers();
}

// Centroid — prioridad: CANCHA_COORDS (bbox real) > GeoJSON > props > venue center
function geomCenter(f) {
    const id = f.properties?.cancha_id ?? f.properties?.id ?? null;

    // 1. Lookup fuente de verdad (tiles_blueprint._BBOXES derivado)
    if (id && CANCHA_COORDS[id]) return CANCHA_COORDS[id];

    // 2. GeoJSON geometry real
    if (f.geometry?.type === 'Point') return f.geometry.coordinates;
    const ring = f.geometry?.coordinates?.[0];
    if (ring && ring.length >= 3) {
        const pts = (ring[0][0] === ring[ring.length-1][0] && ring[0][1] === ring[ring.length-1][1])
            ? ring.slice(0, -1) : ring;
        const n = pts.length;
        return [pts.reduce((s,c) => s+c[0], 0)/n, pts.reduce((s,c) => s+c[1], 0)/n];
    }

    // 3. Propiedades lat/lng explícitas en el feature
    if (f.properties?.lng != null && f.properties?.lat != null)
        return [+f.properties.lng, +f.properties.lat];

    // 4. Fallback: centro del venue actual
    return [VENUES[currentVenue].lng, VENUES[currentVenue].lat];
}

// ── RENDER LAYERS (deck.gl) ──────────────────────────────────────────────
function renderLayers() {
    if (!deckOverlay) return;
    const layers   = [];
    const features = geojson?.features ?? [];

    // Sin features → limpiar overlay, sin error
    if (features.length === 0) {
        deckOverlay.setProps({ layers: [] });
        return;
    }

    // NDVI — ScatterplotLayer billboard flotante (técnica Nagix completa)
    // billboard:true = el círculo siempre mira a la cámara → efecto suspendido
    // Z = ndvi * 250m → campos sanos flotan más alto visualmente
    if (activeL.ndvi) {
        const ndviPts = features
            .filter(f => f.properties?.ndvi != null)
            .map(f => ({
                id:     f.properties?.cancha_id ?? f.properties?.id ?? null,
                pos:    geomCenter(f),
                ndvi:   f.properties.ndvi,
                score:  f.properties.score,
                nombre: f.properties.nombre ?? f.properties.cancha_id ?? f.properties.id ?? 'Cancha',
                tipo:   f.properties.tipo_superficie ?? 'natural'
            }));
        if (ndviPts.length > 0) {
            layers.push(new deck.ScatterplotLayer({
                id:            'ndvi-scatter',
                data:          ndviPts,
                // Z altitude proporcional a NDVI — igual a profundidad en Nagix
                getPosition:   d => [d.pos[0], d.pos[1], Math.max(15, d.ndvi * 250)],
                getRadius:     22,
                radiusUnits:   'meters',
                radiusMinPixels: 9,
                billboard:     true,    // KEY Nagix: siempre mira a la cámara
                antialiasing:  false,
                getFillColor: d => {
                    const t = Math.max(0, Math.min(1, (d.ndvi + 0.1) / 0.7));
                    const c = d3.color(d3.interpolateRdYlGn(t));
                    const alpha = hoveredCanchaId && hoveredCanchaId !== d.id ? 120 : 220;
                    return [Math.round(c.r), Math.round(c.g), Math.round(c.b), alpha];
                },
                getLineColor: d => hoveredCanchaId === d.id
                    ? [255, 215, 80, 255]
                    : [255, 255, 255, 50],
                lineWidthMinPixels: 1,
                stroked:  true,
                filled:   true,
                pickable: true,
                onHover: ({ object }) => {
                    const newId = object?.id ?? null;
                    if (newId === hoveredCanchaId) return;
                    hoveredCanchaId = newId;
                    map.getCanvas().style.cursor = newId ? 'pointer' : '';
                    renderLayers();
                    updateSVGOverlay();
                },
                onClick: ({ object }) => {
                    if (!object) return;
                    map.easeTo({ center: object.pos, zoom: 18.5, pitch: 55, duration: 900 });
                }
            }));
        }

        // Capas de detalle sobre la cancha hover — compactación + zonas de aireación
        if (hoveredCanchaId) {
            const detailFeats = features.filter(f => {
                const fid = f.properties?.cancha_id ?? f.properties?.id;
                return fid === hoveredCanchaId && f.geometry?.type === 'Polygon';
            });

            if (detailFeats.length > 0) {
                // Relleno de diagnóstico: muestra el estado real de la cancha
                layers.push(new deck.GeoJsonLayer({
                    id: 'cancha-diagnostico',
                    data: { type: 'FeatureCollection', features: detailFeats },
                    filled:   true,
                    stroked:  true,
                    getFillColor: f => {
                        const s = f.properties?.score;
                        const h = f.properties?.entropia_h;
                        const val = s != null ? s / 100 : (h ?? 0.5);
                        // Rojo = compactado/necesita aireación · Verde = OK
                        if (val >= 0.65) return [34,  197, 94,  110];
                        if (val >= 0.40) return [234, 179, 8,   130];
                        return                  [229, 62,  62,  160];
                    },
                    getLineColor:       [255, 215, 80, 220],
                    getLineWidth:       2,
                    lineWidthMinPixels: 2,
                    pickable: false,
                }));

                // HeatmapLayer de problema: concentra el calor donde hay estrés
                const stressPoints = detailFeats.flatMap(f => {
                    const center = geomCenter(f);
                    const score  = f.properties?.score ?? 50;
                    const stress = Math.max(0, (60 - score) / 60);
                    if (stress < 0.1) return [];
                    return [{ pos: center, w: stress }];
                });
                if (stressPoints.length > 0) {
                    layers.push(new deck.HeatmapLayer({
                        id:           'cancha-stress-heat',
                        data:         stressPoints,
                        getPosition:  d => d.pos,
                        getWeight:    d => d.w,
                        radiusPixels: 60,
                        colorRange: [
                            [34, 197, 94, 0],
                            [234,179, 8, 180],
                            [229, 62, 62, 240],
                        ],
                    }));
                }

                // Sectores de detalle: esferas a altura proporcional al estrés
                layers.push(new deck.ScatterplotLayer({
                    id:          'cancha-aireacion-spheres',
                    data:        detailFeats,
                    getPosition: f => {
                        const c = geomCenter(f);
                        const s = f.properties?.score;
                        const h = f.properties?.entropia_h;
                        const comp = s != null ? (100 - s) : ((1 - (h ?? 0.5)) * 100);
                        return [c[0], c[1], Math.max(3, comp * 1.8)];
                    },
                    getRadius:   8,
                    radiusUnits: 'meters',
                    getFillColor: f => {
                        const s = f.properties?.score ?? 50;
                        if (s >= 65) return [34,  197, 94,  160];
                        if (s >= 40) return [234, 179, 8,   180];
                        return              [229, 62,  62,  210];
                    },
                    getLineColor: [255, 215, 80, 120],
                    lineWidthMinPixels: 1,
                    stroked:  true,
                    pickable: false,
                }));

                // Terminal — diagnóstico de la cancha activa
                const feat = detailFeats[0];
                const p    = feat?.properties ?? {};
                const ndvi = p.ndvi  != null ? (+p.ndvi).toFixed(3) : '—';
                const sc   = p.score != null ? p.score              : '—';
                const accion = (p.score != null && p.score < 40)
                    ? '<span style="color:#E53E3E">● Airear urgente</span>'
                    : (p.score != null && p.score < 65)
                        ? '<span style="color:#e0c040">● Monitorear humedad</span>'
                        : '<span style="color:#4caf7d">● Estado óptimo</span>';
                document.getElementById('terminal').innerHTML =
                    `<strong>${p.nombre ?? hoveredCanchaId}</strong> &nbsp;·&nbsp; ` +
                    `NDVI <strong>${ndvi}</strong> · Score <strong>${sc}</strong> &nbsp;·&nbsp; ${accion}`;
            }
        }
    }

    // SAR — doble capa Nagix: halo (opacity layer) + núcleo sólido
    // billboard:true = círculos siempre miran a la cámara → efecto esfera flotante
    // antialiasing:false = borde duro sobre fondo oscuro → glow percibido
    if (activeL.sar) {
        let canchas = features
            .filter(f => f.properties != null)
            .map(f => {
                const p   = f.properties;
                const pos = geomCenter(f);
                return {
                    lng:    pos[0],
                    lat:    pos[1],
                    ndvi:   p.ndvi  != null ? +p.ndvi  : null,
                    score:  p.score != null ? +p.score : null,
                    nombre: p.nombre ?? p.cancha_id ?? p.id ?? 'Cancha',
                    id:     p.cancha_id ?? p.id ?? null,
                    tipo:   p.tipo_superficie ?? 'natural',
                };
            });

        // Fallback demo: muestra las 12 canchas de Villa Olímpica cuando el backend no responde
        if (canchas.length === 0) {
            const ids    = ['1FA','2FA','3FA','4FA','5FA','6FA','7FA','8FA','9FA','10FA','1FP','2FP'];
            const ndvis  = [0.62, 0.51, 0.43, 0.72, 0.35, 0.54, 0.47, 0.39, 0.28, 0.45, 0.67, 0.72];
            const scores = [62,   48,   38,   71,   29,   55,   44,   33,   21,   41,   78,   83  ];
            canchas = ids.map((id, i) => {
                const [lng, lat] = CANCHA_COORDS[id] ?? [VENUES.villa_olimpica.lng, VENUES.villa_olimpica.lat];
                return { lng, lat, ndvi: ndvis[i], score: scores[i],
                         nombre: `${id} · Villa Olímpica`, id,
                         tipo: id.includes('FP') ? 'natural' : 'sintetico' };
            });
        }

        if (canchas.length > 0) {
            layers.push(new deck.ScatterplotLayer({
                id:           'halo',
                data:         canchas,
                getPosition:  d => [d.lng, d.lat, (d.score ?? 50) * 20],
                getRadius:    25,
                radiusUnits:  'meters',
                radiusMinPixels: 2,
                radiusMaxPixels: 12,
                opacity:      0.15,
                getFillColor: d => {
                    const t = Math.max(0, Math.min(1, ((d.ndvi ?? 0.05) + 0.1) / 0.7));
                    const c = d3.color(d3.interpolateRdYlGn(t));
                    return [c.r, c.g, c.b];
                },
                billboard:    true,
                antialiasing: false,
                stroked:      false,
                pickable:     false
            }));
            layers.push(new deck.ScatterplotLayer({
                id:           'core',
                data:         canchas,
                getPosition:  d => [d.lng, d.lat, (d.score ?? 50) * 20],
                getRadius:    8,
                radiusUnits:  'meters',
                radiusMinPixels: 1,
                radiusMaxPixels: 6,
                getFillColor: d => {
                    const t = Math.max(0, Math.min(1, ((d.ndvi ?? 0.05) + 0.1) / 0.7));
                    const c = d3.color(d3.interpolateRdYlGn(t));
                    return [c.r, c.g, c.b, 230];
                },
                billboard:    true,
                antialiasing: false,
                stroked:      true,
                getLineColor: [255, 255, 255, 80],
                getLineWidth: 1,
                lineWidthMinPixels: 0.5,
                pickable:     true,
                onClick:      ({object}) => showDetail(object)
            }));
        }
    }

    // HUMEDAD SUELO (Richards) — ColumnLayer 3D por profundidad
    if (activeL.temperatura) {
        const depthKey = ['theta_5cm','theta_10cm','theta_20cm'][richDepth] ?? 'theta_10cm';
        const cols     = features.filter(f => f.properties?.[depthKey] != null);
        if (cols.length > 0) {
            layers.push(new deck.ColumnLayer({
                id: 'richards-col',
                data: cols,
                getPosition: f => geomCenter(f),
                getElevation:  f => (f.properties[depthKey] ?? 0) * 200,
                getFillColor:  [14,165,233,180],
                radius:        3,
                extruded:      true,
                elevationScale: 1
            }));
        }
    }

    // InSAR — ScatterplotLayer punto único con valor real del canonical
    if (activeL.insar) {
        const detalle = canonical?.sectores?.estadio?.detalle
                     ?? canonical?.sectores?.[currentVenue]?.detalle ?? '';
        const m = typeof detalle === 'string' ? detalle.match(/InSAR\s*([\d.]+)\s*mm/i) : null;
        if (m) {
            layers.push(new deck.ScatterplotLayer({
                id: 'insar-pts',
                data: [{ pos:[VENUES[currentVenue].lng, VENUES[currentVenue].lat], v: m[1] }],
                getPosition:  d => d.pos,
                getRadius:    8,
                radiusMinPixels: 8,
                getFillColor: [229,62,62,220],
                pickable: true,
                onClick: info => {
                    if (info.object) {
                        document.getElementById('terminal').innerHTML =
                            `<strong>InSAR:</strong> Deformación estructural ${info.object.v} mm detectada.`;
                    }
                }
            }));
        }
    }

    // Fungosis — ScatterplotLayer canchas en riesgo Dollar Spot
    if (activeL.fungosis) {
        const crList = canonical?.weather_live?.riesgo_fungosis?.canchas_en_riesgo ?? [];
        if (crList.length > 0) {
            const riskPts = features
                .filter(f => {
                    const cid = f.properties?.cancha_id ?? f.properties?.id;
                    return cid != null && crList.includes(cid);
                })
                .map(f => ({
                    pos: f.geometry?.type === 'Point'
                        ? f.geometry.coordinates
                        : [f.properties.lng ?? VENUES[currentVenue].lng,
                           f.properties.lat ?? VENUES[currentVenue].lat]
                }));
            if (riskPts.length > 0) {
                layers.push(new deck.ScatterplotLayer({
                    id: 'fungosis-pts',
                    data: riskPts,
                    getPosition:  d => d.pos,
                    getRadius:    12,
                    radiusMinPixels: 10,
                    getFillColor: [234,179,8,200],
                    stroked:      true,
                    getLineColor: [229,62,62,200],
                    getLineWidth: 1,
                    lineWidthMinPixels: 1,
                    pickable: true,
                    onClick: () => {
                        const sk = canonical?.weather_live?.smith_kerns_pct
                                ?? canonical?.hermes?.climate?.smith_kerns_pct;
                        document.getElementById('terminal').innerHTML =
                            `<span class="alert">⚠ Dollar Spot activo${sk != null ? ` — Smith-Kerns ${sk}%` : ''}</span>`;
                    }
                }));
            }
        }
    }

    // Dale Play — TripsLayer animación recovery post-show
    if (activeL.dale_play && canonical?.show_memory) {
        const mem = canonical.show_memory;
        if (Array.isArray(mem?.recovery_path) && mem.recovery_path.length > 0) {
            layers.push(new deck.TripsLayer({
                id: 'recovery-trips',
                data: mem.recovery_path,
                getPath:       d => d.path,
                getTimestamps: d => d.timestamps,
                getColor:      [229,62,62,220],
                currentTime:   showDay,
                trailLength:   3,
                widthMinPixels: 2
            }));
        }
    }

    deckOverlay.setProps({ layers });
}

// ── SVG Overlay — leader lines + centro de cancha (técnica Nagix) ─────────
// Línea punteada del punto flotante al círculo central de la cancha
function setupSVGOverlay() {
    svgOverlay = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svgOverlay.style.cssText =
        'position:absolute;top:0;left:0;width:100%;height:100%;' +
        'pointer-events:none;z-index:5;overflow:visible;';
    document.getElementById('map').appendChild(svgOverlay);

    ['move', 'zoom', 'rotate', 'pitch', 'resize'].forEach(e => map.on(e, updateSVGOverlay));
}

function _projectPoint(lng, lat, altMeters) {
    // Intenta proyección 3D via deck.gl viewport; fallback a aproximación geométrica
    try {
        const vp = deckOverlay?._deck?.getViewports()?.[0];
        if (vp) {
            const [x, y] = vp.project([lng, lat, altMeters]);
            return { x, y };
        }
    } catch (_) {}

    // Fallback: offset vertical proporcional al pitch y zoom
    const ground  = map.project([lng, lat]);
    const pitch   = map.getPitch() * Math.PI / 180;
    const zoom    = map.getZoom();
    const pxPerM  = (Math.pow(2, zoom) * 256 / (2 * Math.PI * 6378137)) *
                    Math.cos(lat * Math.PI / 180);
    return { x: ground.x, y: ground.y - altMeters * pxPerM * Math.sin(pitch) };
}

function updateSVGOverlay() {
    if (!svgOverlay) return;
    svgOverlay.innerHTML = '';

    const features = geojson?.features ?? [];
    if (!features.length || !activeL.ndvi) return;

    const ndviFeats = features.filter(f => f.properties?.ndvi != null);

    for (const f of ndviFeats) {
        const p     = f.properties;
        const id    = p?.cancha_id ?? p?.id ?? null;
        const pos   = geomCenter(f);
        const ndvi  = p.ndvi ?? 0.3;
        const altM  = Math.max(15, ndvi * 250);
        const hovered = hoveredCanchaId === id;

        // Posición flotante (punto billboard en 3D)
        const float  = _projectPoint(pos[0], pos[1], altM);
        // Posición suelo (círculo central de la cancha)
        const ground = map.project([pos[0], pos[1]]);

        const goldAlpha  = hovered ? '0.95' : '0.45';
        const strokeW    = hovered ? '1.5'  : '0.8';
        const ringRadius = hovered ? '11'   : '7';

        // Leader line punteada — del float al centro
        const ns   = 'http://www.w3.org/2000/svg';
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', float.x);   line.setAttribute('y1', float.y);
        line.setAttribute('x2', ground.x);  line.setAttribute('y2', ground.y);
        line.setAttribute('stroke', `rgba(201,168,76,${goldAlpha})`);
        line.setAttribute('stroke-width', strokeW);
        line.setAttribute('stroke-dasharray', '3 3');
        svgOverlay.appendChild(line);

        // Anillo en el suelo — círculo central de la cancha
        const ring = document.createElementNS(ns, 'circle');
        ring.setAttribute('cx', ground.x); ring.setAttribute('cy', ground.y);
        ring.setAttribute('r',  ringRadius);
        ring.setAttribute('fill', hovered ? 'rgba(255,215,80,0.18)' : 'rgba(201,168,76,0.08)');
        ring.setAttribute('stroke', `rgba(201,168,76,${goldAlpha})`);
        ring.setAttribute('stroke-width', strokeW);
        svgOverlay.appendChild(ring);

        // Punto central del anillo
        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', ground.x); dot.setAttribute('cy', ground.y);
        dot.setAttribute('r',  hovered ? '3' : '1.5');
        dot.setAttribute('fill', `rgba(201,168,76,${goldAlpha})`);
        svgOverlay.appendChild(dot);

        // Pulso animado cuando está hover
        if (hovered) {
            const pulse = document.createElementNS(ns, 'circle');
            pulse.setAttribute('cx', ground.x); pulse.setAttribute('cy', ground.y);
            pulse.setAttribute('r',  '16');
            pulse.setAttribute('fill', 'none');
            pulse.setAttribute('stroke', 'rgba(255,215,80,0.35)');
            pulse.setAttribute('stroke-width', '1');
            const anim = document.createElementNS(ns, 'animate');
            anim.setAttribute('attributeName', 'r');
            anim.setAttribute('values', '11;20;11');
            anim.setAttribute('dur', '2s');
            anim.setAttribute('repeatCount', 'indefinite');
            pulse.appendChild(anim);
            svgOverlay.appendChild(pulse);
        }
    }
}

function showDetail(d) {
    document.getElementById('terminal').innerHTML =
        `<strong>${d.nombre || d.id}</strong> · NDVI: ${d.ndvi != null ? d.ndvi.toFixed(3) : 'Sin dato'} · Score: ${d.score ?? '--'} · ${d.tipo ?? 'natural'}`;
}
</script>
